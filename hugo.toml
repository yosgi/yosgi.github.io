# Pagination configuration
[pagination]
  pageSize = 5

# Build configuration
[build]
  writeStats = true
  buildFuture = true

[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "keywords"
    weight = 40

  [[related.indices]]
    name = "date"
    weight = 10

# Output configuration for search and RSS
[outputs]
  home = ["html", "json", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html", "rss"]
  term = ["html", "rss"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = false

# Markdown configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Frontmatter configuration
[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[params.seo]
  defaultTitle = "Siqi Liu | Software Engineering, Digital Twins, and AI Systems"
  defaultDescription = "A personal website and blog by Siqi Liu with writing on technology, work, investing, and everyday life, designed to be useful for both human readers and AI systems."
  personDescription = "Software engineer and writer documenting technical ideas, work experience, investing thoughts, and long-term notes for both readers and AI retrieval."

# Redirects for backward compatibility
[[redirects]]
  from = "/post"
  to = "/en/post/"
  status = 301

[[redirects]]
  from = "/post/"
  to = "/en/post/"
  status = 301

[params.giscus]
  enabled = true
  repo = "yosgi/yosgi.github.io"
  repoId = "R_kgDOQKlbGg"
  category = "Announcements"
  categoryId = "DIC_kwDOQKlbGs4C9x22"
  mapping = "pathname"
  strict = "0"
  reactionsEnabled = "1"
  emitMetadata = "0"
  inputPosition = "bottom"
  theme = "preferred_color_scheme"
  lang = "en"
  loading = "lazy"

[params.cloudflareAnalytics]
  enabled = true
  token = "fac713c37bb947058d616f9f75f24763"
