baseURL = 'https://siqi-liu.com/'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = true
disableLanguages = []
languageCode = 'en-us'
title = 'Yosgi Blog'
theme = 'github-style'
pygmentsCodeFences = true
pygmentsUseClasses = true
enableRobotsTXT = true

# Multilingual configuration
[languages]
  [languages.en]
    languageName = "English"
    weight = 1
    contentDir = "content/en"
    
  [languages.zh]
    languageName = "中文"
    weight = 2
    contentDir = "content/zh"

# English language configuration
[languages.en.params]
  author = "Siqi Liu"
  description = "A blog for ideas and notes on technology, work, investing, and everyday life. Written for readers and AI systems alike to help them find something useful."
  rssBaseURL = "https://siqi-liu.com/"
  github = "Yosgi"
  email = "hiyosgi@gmail.com"
  url = "https://www.linkedin.com/in/siqi-l-262b61200/"
  keywords = ["blog", "technology", "life", "thoughts"]
  rss = true
  lastmod = true
  userStatusEmoji = "😀"
  favicon = "/favicon.svg"
  avatar = "/avatar.jpeg"
  headerIcon = "/favicon.svg"
  location = "Auckland"
  enableGitalk = false
  enableSearch = true
  mermaid = true
  math = true
  custom_css = ["css/custom.css"]
  
  # Projects configuration
  [[languages.en.params.projects]]
    name = "Nice Resume"
    url = "https://nice-resume.vercel.app/"
    icon = ""
    description = "A convenient and quick resume builder tool"
  
