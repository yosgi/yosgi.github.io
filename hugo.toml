# Pagination configuration
[pagination]
  pageSize = 5

# Build configuration
[build]
  writeStats = true
  buildFuture = true

[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "keywords"
    weight = 40

  [[related.indices]]
    name = "date"
    weight = 10

# Output configuration for search and RSS
[outputs]
  home = ["html", "json", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html", "rss"]
  term = ["html", "rss"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = false

# Markdown configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Frontmatter configuration
[frontmatter]
  lastmod = ["lastmod", ":fileModTime", ":default"]

[params.seo]
  defaultTitle = "Siqi Liu | Software Engineer in Auckland"
  defaultDescription = "Siqi Liu is a software engineer in Auckland with 9+ years of experience across product engineering, frontend architecture, full-stack systems, digital twins, and AI platform work."
  personDescription = "Software engineer at Nextspace Ltd in Auckland with 9+ years of experience across product engineering, frontend architecture, full-stack systems, digital twins, industrial IoT, and AI platform work."
  alternateName = "Yosgi"
  jobTitle = "Software Engineer"
  worksFor = "Nextspace Ltd"
  knowsAbout = ["Software engineering", "Product engineering", "Frontend architecture", "Full-stack development", "Digital twin systems", "AI platform engineering", "Industrial IoT", "React", "TypeScript", "Vue", "Node.js", "Cesium", "MCP", "Web performance", "Investment notes"]

