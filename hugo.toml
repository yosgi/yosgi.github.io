# Pagination configuration
[pagination]
  pageSize = 10

# Build configuration
[build]
  writeStats = true
  buildFuture = true

[related]
  includeNewer = true
  threshold = 20
  toLower = true

  [[related.indices]]
    name = "tags"
    weight = 80

  [[related.indices]]
    name = "categories"
    weight = 60

  [[related.indices]]
    name = "keywords"
    weight = 40

  [[related.indices]]
    name = "date"
    weight = 10

# Output configuration for search and RSS
[outputs]
  home = ["html", "json", "rss"]
  section = ["html", "rss"]
  taxonomy = ["html", "rss"]
  term = ["html", "rss"]

[outputFormats.json]
  mediaType = "application/json"
  baseName = "index"
  isPlainText = false

# Markdown configuration
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Frontmatter configuration
[frontmatter]
  lastmod = ["lastmod", ":git", "date"]

