{{ if and .Site.Params.giscus.enabled (eq .Section "post") }}<section class="comments-section" aria-label="{{ if eq .Language.Lang "zh" }}评论{{ else }}Comments{{ end }}"><div data-giscus="{{ dict "repo" .Site.Params.giscus.repo "repo-id" .Site.Params.giscus.repoId "category" .Site.Params.giscus.category "category-id" .Site.Params.giscus.categoryId "mapping" "pathname" "strict" "0" "reactions-enabled" "1" "emit-metadata" "0" "input-position" "bottom" "lang" (cond (eq .Language.Lang "zh") "zh-CN" "en") | jsonify }}"><button class="text-button">{{ if eq .Language.Lang "zh" }}加载 GitHub 评论{{ else }}Load GitHub comments{{ end }}</button></div></section>{{ end }}
